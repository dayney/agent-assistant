name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Stable Desktop version (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  ci:
    name: Desktop CI gate
    uses: ./.github/workflows/ci.yml

  resolve-tag:
    name: Resolve stable release tag
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create release tag for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/release-tag.sh "$VERSION"
      - name: Select and validate tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_VERSION"
          else
            tag="$PUSH_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Desktop releases require a stable vX.Y.Z tag"
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  desktop-release:
    name: Desktop release
    needs: [resolve-tag]
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: ./.github/workflows/desktop-release.yml
    with:
      tag: ${{ needs.resolve-tag.outputs.tag }}
      signing_mode: ${{ vars.DESKTOP_SIGNING_MODE || 'updater-only' }}
    secrets: inherit
