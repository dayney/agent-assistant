[package]
name = "agent-assistant"
version = "0.1.0"
description = "Local governance workspace for coding agents"
authors = ["dayney"]
edition = "2021"

[lib]
name = "agent_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
