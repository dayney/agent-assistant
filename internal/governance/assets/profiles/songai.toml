id = "songai"
version = "2026.08.28"
project_root = "/Users/krui/git/work/songai"
documentation_root = "/Users/krui/git/monorepo-docs/songai"
source_documents = ["STYLE.md", "CLAUDE.md", "AGENTS.md", "src/i18n/CLAUDE.md"]
package_manager = "yarn"
materialization_agents = ["codex", "cursor", "gemini", "antigravity"]
local_adapters = ["AGENTS.md", "GEMINI.md"]
stack = ["Next.js 15 App Router", "React 19", "JavaScript/JSX plus TypeScript", "Tailwind CSS 3.4", "Ant Design 5", "local shadcn/Radix UI primitives", "Sass/SCSS", "React Context + Zustand + legacy Redux", "Supabase", "next-intl", "FFmpeg + Wavesurfer", "Replicate + AI providers", "Stripe + Paddle + USDT"]
font_policy = "No new fonts or explicit font-family selection; inherit the current global font."
rules = [
  "Use the existing STYLE.md and module conventions; do not create a replacement project policy source.",
  "Preserve existing CLAUDE.md, src/i18n/CLAUDE.md, and other native adapter files.",
  "New ordinary UI uses the existing local primitives and Tailwind; check the module before using Ant Design.",
  "Use next-intl for user-facing copy and preserve the existing authentication, billing, and Realtime contracts.",
  "Do not run env:test or env:prod commands as part of local verification."
]

[commands]
format = "yarn prettier --check ."
lint = "yarn lint"
typecheck = "yarn tsc --noEmit"
build = "yarn build"
i18n = "yarn i18n:verify"

[defaults]
ui = "Existing local primitives + Tailwind + cn()"
state = "Preserve the current Context/Zustand/legacy Redux owner"
api = "Reuse the established Supabase auth, validation, and error contracts"
realtime = "Use the existing Supabase Realtime path"
